<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Profile</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
      .profile-container {
        max-width: 500px;
        margin: 40px auto;
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(8px);
        border-radius: 12px;
        padding: 25px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        text-align: center
      }

      .profile-avatar {
        width: 90px;
        height: 90px;
        border-radius: 50%;
        background: linear-gradient(135deg, #4f46e5, #7c3aed);
        color: #fff;
        font-size: 36px;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 15px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2)
      }

      .info {
        width: 100%;
        padding: 1rem 2rem;
        text-align: left;
        font-size: 16px;
        color: #333;
      }
      .info p {
        margin: 10px 0;
        font-weight: 500
      }
      .info span {
        font-weight: 600;
      }
      .title {
        display: inline-block;
        line-height: 2rem;
        border-radius: 0.4rem;
        background-color: #e1e0e093;
        width: 25%;
        padding: 0.2rem 0.6rem;
      }

      .btn {
        display: inline-block;
        padding: 10px 16px;
        border-radius: 6px;
        background: #4f46e5;
        color: #fff;
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
        transition: background .3s;
        margin: 5px
      }

      .btn:hover {
        background: #3730a3
      }

      .logout-btn {
        background: #ef4444
      }

      .logout-btn:hover {
        background: #b91c1c
      }
    </style>
  </head>

  <body>
    <nav>
      <div class="logo"><i class="fas fa-calendar-check"></i> Student System</div>
      <div class="user-menu">
        <i class="fas fa-user-circle user-icon"></i>
        <div class="dropdown">
          <a href="profile.html">Profile</a>
          <a href="#" onclick="logout()">Logout</a>
        </div>
      </div>
    </nav>

    <div class="profile-container">
      <div class="profile-avatar" id="avatar">U</div>
      <div class="info">
        <p><span class="title">Username</span>: <span id="username"></span></p>
        <p><span class="title">Email</span>: <span id="email"></span></p>
      </div>

      <a href="dashboard.html" class="btn">Go to Dashboard</a>
      <button onclick="logout()" class="btn logout-btn">Logout</button>
    </div>

    <script src="profile.js"></script>
  </body>

</html>
